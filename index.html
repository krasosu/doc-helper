<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Download Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }

      .card {
        background: #020617;
        border-radius: 0.75rem;
        padding: 2rem 2.5rem;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
        text-align: center;
        max-width: 420px;
        width: 100%;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #9ca3af;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.75rem;
        font-size: 1rem;
        font-weight: 500;
        color: #0b1120;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        box-shadow: 0 18px 45px rgba(59, 130, 246, 0.6);
        transition: transform 0.12s ease-out, box-shadow 0.12s ease-out,
          filter 0.12s ease-out;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
        box-shadow: 0 22px 60px rgba(59, 130, 246, 0.75);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.6);
      }

      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Dateien herunterladen</h1>
      <p>Wähle eine Datei zum Öffnen oder Herunterladen.</p>
      <div id="file-list"></div>
      <p id="file-list-empty" class="hint" style="display: none;">
        Keine Dateien im Bucket. In MinIO unter Bucket „documents“ Dateien hochladen.
      </p>
    </main>

    <script src="dist/main.js" type="module"></script>
  </body>
</html>
